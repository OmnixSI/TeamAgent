name = "inkboard-team"
account_id = "fadeed4822ac4e4e518ed6eddc8d35ce"
main = "src/worker.ts"
compatibility_date = "2026-11-11"
[[d1_databases]]
binding = "DB"
database_name = "inkboard-team"
database_id = "42e95fb2-16f8-46d9-bf32-34f3e88a4443"
[triggers]
crons = ["* * * * *", "*/5 * * * *"]
[[queues.producers]]
binding = "WORK"
queue = "inkboard-team"
[[queues.consumers]]
queue = "inkboard-team"
max_batch_size = 5
max_batch_timeout = 1
max_concurrency = 3
max_retries = 2
dead_letter_queue = "inkboard-team-dlq"

[[queues.consumers]]
queue = "inkboard-team-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[[queues.producers]]
binding = "CHAT"
queue = "inkboard-team-chat"
[[queues.consumers]]
queue = "inkboard-team-chat"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 2

[build]
command = "npm run build:web && npm run build:selfcard"

[[queues.producers]]
binding = "TOOLS"
queue = "team-agent-tools"
[[queues.consumers]]
queue = "team-agent-tools"
max_batch_size = 5
max_batch_timeout = 1
max_concurrency = 3
max_retries = 2
dead_letter_queue = "team-agent-tools-dlq"

[[queues.consumers]]
queue = "team-agent-tools-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = false
