name = "teamagent"
account_id = "fadeed4822ac4e4e518ed6eddc8d35ce"
main = "src/index.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Cloud computer: one Linux container, started on demand and asleep 90 seconds after the last use.
# The image (Cloudflare's hosted Debian) and the size are chosen in src/computer.ts; no Docker build.
[[containers]]
class_name = "Computer"
scheduling_policy = "durable_object"

[[durable_objects.bindings]]
name = "COMPUTER"
class_name = "Computer"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Computer"]

# Watchdog only: the Hub keeps itself alive with alarms; this wakes it after a deploy.
[triggers]
crons = ["*/2 * * * *"]

[vars]
GITHUB_ORG = "OmnixSI"
IMAGE_MODEL = "gpt-image-2.5-flare"
CHAT_MODEL = "deepseek-flash"
# QQ member ids allowed to change the bot's own settings directly (comma separated).
OWNERS = "0FC1E8A8BD28981E86866125AC3FCEFF"
RELAY_URL = "https://relay-dusky-five.vercel.app"
# Where published pages and transfers are reachable from outside.
PUBLIC_URL = "https://teamagent.inkboard-server.workers.dev"
# The same pages through the Hong Kong mirror (relay/api/site.js), for networks that cannot reach workers.dev.
PUBLIC_URL_CN = "https://relay-dusky-five.vercel.app"

# Headless browser for rendering documents, mind maps and pages to pictures (included in Workers Paid).
[browser]
binding = "BROWSER"

# Large files (chat pictures kept before their QQ links expire, big outputs, job checkpoints). R2 free tier.
[[r2_buckets]]
binding = "FILES"
bucket_name = "teamagent"

# Workers AI: 10,000 neurons a day are free; every call is metered and stops at 8,000 (src/budget.ts).
# Vectors for searching by meaning are kept in the Hub's own SQLite, which costs nothing.
[ai]
binding = "AI"

# Lets the Hub notice that a newer version was deployed and restart itself onto it.
[version_metadata]
binding = "VERSION"

[observability]
enabled = true
