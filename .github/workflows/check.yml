name: Check
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: teamagent-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, macOS, teamagent]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check local Python
        run: python3 -c "import sys; assert sys.version_info >= (3, 12); print(sys.version)"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install runner test dependencies
        run: |
          python3 -m venv .venv-runner
          .venv-runner/bin/python -m pip install --quiet -r runner/requirements.txt
      - name: Run Python runner tests
        run: PATH="$PWD/.venv-runner/bin:$PATH" npm run test:runner
      - run: npm run check:ui
      - run: npm ci --prefix clients
      - run: npm test --prefix clients
      - name: Deploy shared team service
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TEAM_ADMIN_TOKEN: ${{ secrets.TEAM_ADMIN_TOKEN }}
          TEAM_RUNNER_TOKEN: ${{ secrets.TEAM_RUNNER_TOKEN }}
          TEAM_QQ_APP_ID: ${{ secrets.TEAM_QQ_APP_ID }}
          TEAM_QQ_APP_SECRET: ${{ secrets.TEAM_QQ_APP_SECRET }}
          TEAM_AUTOLOOP_SOURCE_KEY: ${{ secrets.TEAM_AUTOLOOP_SOURCE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Without the secret, fall back to the runner machine's own `wrangler login`.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then unset CLOUDFLARE_API_TOKEN; fi
          python3 scripts/sync-runtime-secrets.py
          npm run db:migrate
          npm run deploy
          node scripts/verify-release.mjs
          python3 scripts/install-local.py
          python3 scripts/queue-runtime-reload.py
