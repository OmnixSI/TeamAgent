name = "teamagent"
account_id = "fadeed4822ac4e4e518ed6eddc8d35ce"
main = "src/index.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Watchdog only: the Hub keeps itself alive with alarms; this wakes it after a deploy.
[triggers]
crons = ["*/2 * * * *"]

[vars]
GITHUB_ORG = "OmnixSI"
IMAGE_MODEL = "gpt-image-2.5-flare"
CHAT_MODEL = "deepseek-flash"
# QQ member ids allowed to change the bot's own settings directly (comma separated).
OWNERS = "0FC1E8A8BD28981E86866125AC3FCEFF"
RELAY_URL = "https://relay-dusky-five.vercel.app"

# Headless browser for rendering documents, mind maps and pages to pictures (included in Workers Paid).
[browser]
binding = "BROWSER"

[observability]
enabled = true
